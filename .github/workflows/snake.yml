# ═══════════════════════════════════════════════════════════════════
#  Generates the snake animation that eats your contribution graph.
#  Commits the resulting SVG to the `output` branch, which the README
#  reads from via raw.githubusercontent.com.
#
#  Setup: no secrets needed. Just commit this file. Then run it once
#  manually from the Actions tab (workflow_dispatch) so the `output`
#  branch is created. After that it runs automatically every 12h.
# ═══════════════════════════════════════════════════════════════════

name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: neelraval13
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#F724A9&color_dots=#1F222E,#3a1d3d,#7a2a6e,#F724A9,#0ABDC6

      - name: Push the SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
